<div class="cabecera">
  <h2>Marcas</h2>
  <p-button label="Nueva marca" icon="pi pi-plus" (onClick)="nuevo.emit()" />
</div>

<div class="filtros">
  <input
    pInputText
    type="text"
    placeholder="Buscar marca..."
    [value]="filtro()"
    (input)="filtro.set($any($event.target).value)"
    class="buscador-input"
  />

  <div class="filtro-activos">
    <p-toggleswitch
      [(ngModel)]="mostrarInactivas"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="mostrarInactivas.set($event)"
    />
    <span>Ver inactivas</span>
  </div>
</div>

<p-table
  [value]="marcasFiltradas()"
  [loading]="marcaService.cargando()"
  [paginator]="true"
  [rows]="10"
  [rowHover]="true"
  dataKey="id"
  styleClass="tabla-marcas"
>
  <ng-template pTemplate="header">
    <tr>
      <th>Nombre</th>
      <th>Estado</th>
      <th class="col-acciones">Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-marca>
    <tr [class.fila-inactiva]="!marca.activo">
      <td>{{ marca.nombre }}</td>
      <td>
        <span class="etiqueta-estado" [class.activo]="marca.activo" [class.inactivo]="!marca.activo">
          {{ marca.activo ? 'Activa' : 'Inactiva' }}
        </span>
      </td>
      <td class="col-acciones">
        <div class="botones-fila">
          <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm boton-accion color-editar" (click)="editar.emit(marca)" pTooltip="Editar"></button>
          @if (marca.activo) {
            <button pButton icon="pi pi-trash" class="p-button-text p-button-sm boton-accion color-eliminar" (click)="abrirConfirmDesactivar(marca)" pTooltip="Desactivar"></button>
          }
        </div>
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="3" class="empty-msg">No se encontraron marcas</td>
    </tr>
  </ng-template>
</p-table>

<app-confirm-dialog
  [visible]="dialogVisible()"
  titulo="Desactivar marca"
  [mensaje]="'¿Desactivar la marca ' + marcaADesactivar()?.nombre + '? Los modelos asociados podrían verse afectados.'"
  labelConfirmar="Desactivar"
  [cargando]="marcaService.cargando()"
  (confirmado)="onConfirmado()"
  (cancelado)="cerrarDialog()"
/>
