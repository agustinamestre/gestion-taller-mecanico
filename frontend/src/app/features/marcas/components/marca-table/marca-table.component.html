<div class="marcas-container">
  <div class="cabecera">
    <h2>Marcas</h2>
    <p-button label="Nueva marca" icon="pi pi-plus" (onClick)="nuevo.emit()" />
  </div>

  <div class="filtros">
    <input
      pInputText
      type="text"
      placeholder="Buscar marca..."
      [value]="filtro()"
      (input)="filtro.set($any($event.target).value)"
      class="buscador-input"
    />
  </div>

  <p-table
    [value]="marcasFiltradas()"
    [loading]="marcaService.cargando()"
    [paginator]="true"
    [rows]="10"
    [rowHover]="true"
    dataKey="id"
    styleClass="tabla-marcas"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th class="col-acciones">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-marca>
      <tr>
        <td>{{ marca.nombre }}</td>
        <td class="col-acciones">
          <div class="botones-fila">
            <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm boton-accion color-editar" (click)="editar.emit(marca)" pTooltip="Editar"></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2" class="empty-msg">No se encontraron marcas</td>
      </tr>
    </ng-template>
  </p-table>
</div>
