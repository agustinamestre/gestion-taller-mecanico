<div class="form-container">
  <div class="form-card">
    <div class="form-icono">
      <i class="pi pi-tag"></i>
    </div>
    <h2>{{ edicion() ? 'Modificar marca' : 'Nueva marca' }}</h2>
    <p class="form-hint">{{ edicion() ? 'Actualizá el nombre de la marca' : 'Ingresá el nombre de la nueva marca' }}</p>

    <form [formGroup]="form" (ngSubmit)="guardar()" novalidate class="form-completo">
      <div class="campo" [class.campo-error]="invalid('nombre')">
        <label for="nombre">Nombre *</label>
        <input pInputText id="nombre" formControlName="nombre" placeholder="Toyota" />
        @if (invalid('nombre')) {
          <span class="error-msg">Campo requerido (mín. 2 caracteres)</span>
        }
      </div>

      <div class="form-footer">
        <p-button
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          (onClick)="cancelar.emit()"
          type="button"
        />
        <p-button
          [label]="marcaService.cargando() ? 'Guardando...' : (edicion() ? 'Guardar cambios' : 'Registrar marca')"
          [loading]="marcaService.cargando()"
          type="submit"
        />
      </div>
    </form>
  </div>
</div>
