<div class="form-container">
  <div class="form-card">
    <div class="form-icono">
      <i class="pi pi-phone"></i>
    </div>
    <h2>Contactar</h2>
    @if (alertaService.alertaSeleccionada(); as alerta) {
      <p class="form-hint">Vehículo <strong>{{ alerta.patenteVehiculo }}</strong> — {{ alerta.nombreCliente }}</p>
    }

    <div class="form-completo">
      <p class="form-hint">
        Se va a contactar al cliente por WhatsApp. Si tiene un email registrado, también se le va a enviar un mail automáticamente.
      </p>

      <div class="campo">
        <label>Observaciones</label>
        <textarea
          pTextarea
          rows="3"
          [(ngModel)]="observaciones"
          placeholder="Observaciones (opcional)"
        ></textarea>
      </div>

      <div class="form-footer">
        <p-button
          label="Cancelar"
          severity="secondary"
          [outlined]="true"
          [disabled]="alertaService.cargando()"
          (onClick)="cancelar.emit()"
          type="button"
        />
        <p-button
          [label]="alertaService.cargando() ? 'Contactando...' : 'Confirmar'"
          [loading]="alertaService.cargando()"
          (onClick)="confirmar()"
          type="button"
        />
      </div>
    </div>
  </div>
</div>
