<p-dialog
  [visible]="visible()"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  [resizable]="false"
  styleClass="km-dialog"
>
  <ng-template pTemplate="header">
    <div class="dialog-header">
      <i class="pi pi-gauge"></i>
      <span>Actualizar kilometraje</span>
    </div>
  </ng-template>

  <div class="dialog-body">
    <p class="km-actual">
      Kilometraje actual: <strong>{{ kmActual | number }} km</strong>
    </p>
    <form [formGroup]="form" novalidate>
      <div class="campo" [class.campo-error]="form.get('kilometrajeActual')?.invalid && form.get('kilometrajeActual')?.touched">
        <label>Nuevo kilometraje *</label>
        <p-inputnumber
          formControlName="kilometrajeActual"
          [min]="kmActual"
          [useGrouping]="true"
          suffix=" km"
          placeholder="Ingresá el nuevo valor"
        />
        @if (form.get('kilometrajeActual')?.invalid && form.get('kilometrajeActual')?.touched) {
          <span class="error-msg">
            @if (form.get('kilometrajeActual')?.hasError('min')) {
              El nuevo kilometraje no puede ser menor al actual
            } @else {
              Campo requerido
            }
          </span>
        }
      </div>
    </form>
  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <p-button
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        [disabled]="vehiculoService.cargando()"
        (onClick)="onCancelar()"
      />
      <p-button
        label="Actualizar"
        icon="pi pi-check"
        [loading]="vehiculoService.cargando()"
        (onClick)="guardar()"
      />
    </div>
  </ng-template>
</p-dialog>
