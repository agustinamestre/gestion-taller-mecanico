@if (!abierto()) {
  <div class="cabecera-acciones-password">
    <p-button
      label="Cambiar contraseña"
      icon="pi pi-lock"
      (onClick)="abrir()"
    />
  </div>
} @else {
  <form [formGroup]="form" (ngSubmit)="guardar()" novalidate class="ficha ficha-form">
    <h3>Cambiar contraseña</h3>

    <div class="campo" [class.campo-error]="invalid('passwordActual')">
      <label for="passwordActual">Contraseña actual *</label>
      <p-password
        inputId="passwordActual"
        formControlName="passwordActual"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
        styleClass="password-full"
      />
      @if (invalid('passwordActual')) {
        <span class="error-msg">Campo requerido</span>
      }
    </div>

    <div class="campo" [class.campo-error]="invalid('passwordNueva')">
      <label for="passwordNueva">Nueva contraseña *</label>
      <p-password
        inputId="passwordNueva"
        formControlName="passwordNueva"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="new-password"
        styleClass="password-full"
      />
      @if (invalid('passwordNueva')) {
        <span class="error-msg">Mínimo 6 caracteres</span>
      }
    </div>

    <div class="campo" [class.campo-error]="invalid('confirmarPassword')">
      <label for="confirmarPassword">Confirmar nueva contraseña *</label>
      <p-password
        inputId="confirmarPassword"
        formControlName="confirmarPassword"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="new-password"
        styleClass="password-full"
      />
      @if (invalid('confirmarPassword')) {
        <span class="error-msg">Campo requerido</span>
      }
    </div>

    <div class="form-footer">
      <p-button
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        (onClick)="cancelar()"
        type="button"
      />
      <p-button
        [label]="perfilService.cargando() ? 'Guardando...' : 'Cambiar contraseña'"
        [loading]="perfilService.cargando()"
        type="submit"
      />
    </div>
  </form>
}
