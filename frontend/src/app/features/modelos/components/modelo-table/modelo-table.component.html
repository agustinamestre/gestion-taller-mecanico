<div class="modelos-container">
  <div class="cabecera">
    <h2>Modelos</h2>
    <p-button label="Nuevo modelo" icon="pi pi-plus" (onClick)="nuevo.emit()" />
  </div>

  <div class="filtros">
    <div class="filtros-izquierda">
      <p-select
        [options]="marcaService.marcas()"
        optionLabel="nombre"
        optionValue="id"
        [(ngModel)]="marcaFiltro"
        [ngModelOptions]="{ standalone: true }"
        placeholder="Filtrar por marca"
        [showClear]="true"
        class="select-marca"
      />
      <input
        pInputText
        type="text"
        placeholder="Buscar modelo..."
        [value]="filtroTexto()"
        (input)="filtroTexto.set($any($event.target).value)"
        class="buscador-input"
      />
    </div>
  </div>

  <div class="tabla-scroll">
  <p-table
    [value]="modelosFiltrados()"
    [loading]="modeloService.cargando()"
    [paginator]="true"
    [rows]="10"
    [rowHover]="true"
    dataKey="id"
    styleClass="tabla-modelos"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Marca</th>
        <th class="col-acciones">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-modelo>
      <tr>
        <td>{{ modelo.nombre }}</td>
        <td>{{ modelo.marca.nombre }}</td>
        <td class="col-acciones">
          <div class="botones-fila">
            <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm boton-accion color-editar" (click)="editar.emit(modelo)" pTooltip="Editar"></button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="3" class="empty-msg">No se encontraron modelos</td>
      </tr>
    </ng-template>
  </p-table>
  </div>
</div>
